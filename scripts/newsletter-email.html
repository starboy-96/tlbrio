<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="color-scheme" content="light" />
<meta name="supported-color-schemes" content="light" />
</head>
<body style="margin:0;padding:0;background:#f0f0ee;">
<table width="100%" cellpadding="0" cellspacing="0" style="background:#f0f0ee;padding:40px 16px;">
  <tr><td align="center">
    <table width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;border-radius:20px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,0.08);">

      {{IMAGE_BLOCK}}

      <!-- Header -->
      <tr><td style="background:#0a1a2f;padding:32px 40px 28px;">
        <p style="margin:0 0 12px;color:#94e561;font-family:Arial,sans-serif;font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;">tlbr.io &middot; Weekly</p>
        <h1 style="margin:0;color:#ffffff;font-family:Georgia,serif;font-size:26px;font-weight:700;line-height:1.3;">{{BLOG_TITLE}}</h1>
      </td></tr>

      <!-- Body -->
      <tr><td style="background:#ffffff;padding:32px 40px 28px;color:#0a1a2f;font-family:Arial,sans-serif;font-size:16px;line-height:1.8;">
        {{HTML_BODY}}
        <p style="margin:28px 0 0;text-align:left;">
          <a href="{{BLOG_URL}}" style="display:inline-block;background:#0a1a2f;color:#94e561;padding:14px 28px;border-radius:999px;text-decoration:none;font-weight:700;font-family:Arial,sans-serif;font-size:15px;">
            Read on tlbr.io &rarr;
          </a>
        </p>
      </td></tr>

      <!-- Footer -->
      <tr><td style="background:#f0f0ee;padding:20px 40px;border-top:1px solid #e4e4e2;">
        <p style="margin:0;color:#999999;font-family:Arial,sans-serif;font-size:12px;text-align:center;line-height:1.7;">
          You subscribed at <a href="https://tlbr.io" style="color:#0a1a2f;text-decoration:underline;">tlbr.io</a>. &nbsp;&bull;&nbsp;
          <a href="{{UNSUB_URL}}" style="color:#999999;text-decoration:underline;">Unsubscribe</a>
        </p>
      </td></tr>

    </table>
  </td></tr>
</table>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="color-scheme" content="light" />
<meta name="supported-color-schemes" content="light" />
</head>
<body style="margin:0;padding:0;background:#e8e8e6;">
<table width="100%" cellpadding="0" cellspacing="0" style="background:#e8e8e6;padding:40px 16px;">
  <tr><td align="center">
    <table width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;border-radius:20px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,0.12);">

      <!-- Tuesday bar -->
      <tr><td style="background:#94e561;padding:11px 36px;">
        <table width="100%" cellpadding="0" cellspacing="0">
          <tr>
            <td style="font-family:Arial,sans-serif;font-size:10.5px;font-weight:700;letter-spacing:0.2em;text-transform:uppercase;color:#0a1a2f;">
              &#9670;&nbsp;&nbsp;Tuesday Edition
            </td>
            <td align="right" style="font-family:Arial,sans-serif;font-size:10.5px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:#0a1a2f;">
              tlbr.io
            </td>
          </tr>
        </table>
      </td></tr>

      {{IMAGE_BLOCK}}

      <!-- Title + hook -->
      <tr><td style="background:#0a1a2f;padding:36px 40px 32px;">
        <p style="margin:0 0 18px;color:#94e561;font-family:Arial,sans-serif;font-size:10.5px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;">
          Weekly Drop &nbsp;&middot;&nbsp; {{DATE_LABEL}}
        </p>
        <h1 style="margin:0 0 22px;color:#ffffff;font-family:Arial,sans-serif;font-size:27px;font-weight:700;line-height:1.25;">{{BLOG_TITLE}}</h1>
        <p style="margin:0;padding:0 0 0 16px;border-left:3px solid #94e561;color:rgba(255,255,255,0.72);font-family:Arial,sans-serif;font-size:15px;line-height:1.7;">{{BLOG_DESCRIPTION}}</p>
      </td></tr>

      <!-- Divider -->
      <tr><td style="background:#0a1a2f;padding:0 40px;">
        <div style="height:1px;background:rgba(255,255,255,0.1);"></div>
      </td></tr>

      <!-- Body -->
      <tr><td style="background:#ffffff;padding:36px 40px 32px;color:#0a1a2f;font-family:Arial,sans-serif;font-size:16px;line-height:1.85;">
        {{HTML_BODY}}
        <p style="margin:36px 0 0;">
          <a href="{{BLOG_URL}}" style="display:inline-block;background:#0a1a2f;color:#94e561;padding:15px 30px;border-radius:999px;text-decoration:none;font-weight:700;font-family:Arial,sans-serif;font-size:14px;letter-spacing:0.04em;">
            Read the full story &nbsp;&#8594;
          </a>
        </p>
      </td></tr>

      <!-- Footer -->
      <tr><td style="background:#0a1a2f;padding:24px 40px 20px;">
        <p style="margin:0 0 10px;color:rgba(148,229,97,0.55);font-family:Arial,sans-serif;font-size:10px;font-weight:700;text-align:center;letter-spacing:0.2em;text-transform:uppercase;">
          Every Tuesday. No spam. Just signal.
        </p>
        <p style="margin:0;color:rgba(255,255,255,0.28);font-family:Arial,sans-serif;font-size:11px;text-align:center;line-height:1.7;">
          You subscribed at <a href="https://tlbr.io" style="color:rgba(255,255,255,0.45);text-decoration:underline;">tlbr.io</a> &nbsp;&bull;&nbsp;
          <a href="{{UNSUB_URL}}" style="color:rgba(255,255,255,0.28);text-decoration:underline;">Unsubscribe</a>
        </p>
      </td></tr>

    </table>
  </td></tr>
</table>
</body>
</html>

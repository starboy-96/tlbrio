name: Weekly Blog Post

on:
  schedule:
    # Runs every Tuesday and Thursday at 8:00am UTC
    - cron: "0 8 * * 2,4"
  # Allow manual trigger from the GitHub Actions tab
  workflow_dispatch:

jobs:
  generate-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Generate blog post with AI
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          TODAY=$(date +%Y-%m-%d)

          # Topics to rotate through so posts stay varied
          TOPICS=(
            "Why brand consistency in presentations directly impacts client trust and how to enforce it without a design team"
            "The hidden cost of off-brand slides: how much time your team wastes fixing formatting"
            "How to build a PowerPoint template that non-designers can't break"
            "5 alignment mistakes everyone makes in PowerPoint and how to fix them in one click"
            "Why your sales deck is losing deals before you even speak"
            "How to maintain brand standards across a team of 100+ people in PowerPoint"
            "The case for a bespoke PowerPoint toolbar: why generic tools fall short for enterprise teams"
            "How to make PowerPoint work harder for your marketing team"
            "Slide design for finance teams: clarity, consistency, and credibility"
            "Why HR decks are always off-brand and what to do about it"
            "The difference between a good slide and a great one: it's not creativity, it's consistency"
            "How law firms and professional services can elevate their pitch decks"
            "From chaos to consistency: standardising presentations across a large organisation"
            "Why your design team is spending too much time fixing other people's slides"
            "What makes a PowerPoint add-in actually worth deploying company-wide"
          )

          # Pick a topic based on the week of the year so it cycles predictably
          WEEK_OF_YEAR=$(date +%V)
          TOPIC_INDEX=$(( ($WEEK_OF_YEAR - 1) % ${#TOPICS[@]} ))
          TOPIC="${TOPICS[$TOPIC_INDEX]}"

          # Curated Unsplash images — dynamic, high-energy visuals for each post
          IMAGES=(
            "https://images.unsplash.com/photo-1611532736597-de2d4265fba3?w=1200&auto=format&q=80"
            "https://images.unsplash.com/photo-1542744094-3a31f272c490?w=1200&auto=format&q=80"
            "https://images.unsplash.com/photo-1551434678-e076c223a692?w=1200&auto=format&q=80"
            "https://images.unsplash.com/photo-1454165804606-c3d57bc86b40?w=1200&auto=format&q=80"
            "https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?w=1200&auto=format&q=80"
            "https://images.unsplash.com/photo-1497215842964-222b430dc094?w=1200&auto=format&q=80"
            "https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?w=1200&auto=format&q=80"
            "https://images.unsplash.com/photo-1531482615713-2afd69097998?w=1200&auto=format&q=80"
            "https://images.unsplash.com/photo-1556761175-b413da4baf72?w=1200&auto=format&q=80"
            "https://images.unsplash.com/photo-1590402494682-cd3fb53b1f70?w=1200&auto=format&q=80"
            "https://images.unsplash.com/photo-1600880292089-90a7e086ee0c?w=1200&auto=format&q=80"
            "https://images.unsplash.com/photo-1453928582365-b6ad33cbcf64?w=1200&auto=format&q=80"
            "https://images.unsplash.com/photo-1434030216411-0b793f4b4173?w=1200&auto=format&q=80"
            "https://images.unsplash.com/photo-1567532939604-b6b5b0db2604?w=1200&auto=format&q=80"
            "https://images.unsplash.com/photo-1527689368864-3a821dbccc34?w=1200&auto=format&q=80"
          )
          # Use day-of-year so every post gets a different image
          DAY_OF_YEAR=$(date +%j)
          IMAGE_INDEX=$(( (10#$DAY_OF_YEAR - 1) % ${#IMAGES[@]} ))
          IMAGE_URL="${IMAGES[$IMAGE_INDEX]}"

          echo "Generating post on topic: $TOPIC"

          RESPONSE=$(curl -s "https://api.mistral.ai/v1/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $MISTRAL_API_KEY" \
            -d "$(jq -n \
              --arg system "You are a content writer for tlbr.io, a bespoke PowerPoint add-in for enterprise teams. You write practical, opinionated blog posts about presentation design, brand consistency, and working in PowerPoint. You write like a sharp senior consultant who has fixed hundreds of bad decks. You speak directly to the reader. You have a point of view. Always write in British English.\n\nVOICE AND STYLE RULES (follow strictly):\n- Write like a real person talking to a colleague, not a textbook or a press release\n- Use short sentences. Mix them with longer ones for rhythm.\n- Use \"you\" and \"your\" throughout. Address the reader directly.\n- Start sentences with And, But, or So when it feels natural\n- One-sentence paragraphs are fine and encouraged for emphasis\n- Active voice only. The subject does the action.\n- Use specific, concrete examples. Never vague generalities.\n- Vary sentence length and structure so it does not feel robotic\n\nTHINGS TO NEVER DO:\n- Never use em dashes. Use commas, full stops, or rewrite the sentence.\n- Never start a sentence with However, Moreover, Furthermore, Nevertheless, or Therefore\n- Never use filler phrases: in today's world, it is important to note, it goes without saying, in light of, one must consider, delve into, navigate the landscape, leverage, utilise (use use instead)\n- Never use the not only X but also Y construction\n- Never write a generic opener that could apply to any topic. Start with something specific and sharp.\n- Never use passive voice\n- Never sound promotional or salesy. Be useful first." \
              --arg topic "$TOPIC" \
              --arg today "$TODAY" \
              '{
                model: "mistral-small-latest",
                temperature: 0.8,
                messages: [
                  { role: "system", content: $system },
                  { role: "user", content: ("Write a blog post on this topic: " + $topic + "\n\nReturn ONLY valid markdown starting with YAML frontmatter in this exact format (no code fences, no extra text before or after):\n\n---\ntitle: \"The title here — maximum 8 words\"\ndescription: \"A compelling one-sentence meta description that summarises the post and why it matters, between 120 and 155 characters — never shorter than 100 characters\"\ndate: \"" + $today + "\"\ntags: [\"tag1\", \"tag2\", \"tag3\"]\nauthor: \"tlbr.io team\"\n---\n\nThen the blog post content in markdown. Requirements:\n- 600-900 words\n- Title must be 8 words or fewer\n- Open with a sharp, specific first sentence that hooks the reader. Not a broad statement about the industry.\n- Use ## for section headings. Keep headings punchy and direct.\n- Use bullet points only where a list genuinely helps. Not as a crutch.\n- End with a clear, practical takeaway the reader can act on today\n- Do not mention competitors by name\n- Do not use the phrase in conclusion\n- Do not use em dashes anywhere in the post\n- SEO: include the primary keyword naturally in the first paragraph and use keyword variations throughout\n- Internal links: include 2 links to tlbr.io pages using this format: [link text](https://tlbr.io/#features), [link text](https://tlbr.io/#pricing), [link text](https://tlbr.io/#demo), or [link text](https://tlbr.io/blog). Choose whichever 2 are most relevant to the content.\n- External links: include 1-2 links to authoritative external sources such as industry research, statistics, or relevant articles that support a specific claim in the post") }
                ]
              }' \
            )"
          )

          # Extract the content from the API response
          POST_CONTENT=$(echo "$RESPONSE" | jq -r '.choices[0].message.content')

          if [ -z "$POST_CONTENT" ] || [ "$POST_CONTENT" = "null" ]; then
            echo "Error: No content returned from OpenAI"
            echo "Response: $RESPONSE"
            exit 1
          fi

          # Derive a clean slug from the generated title, always prefixed with date for uniqueness
          TITLE=$(echo "$POST_CONTENT" | grep -m1 '^title:' | sed 's/^title: *//' | tr -d '"' | tr -d "'")
          TITLE_SLUG=$(echo "$TITLE" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/-\+/-/g' | sed 's/^-//;s/-$//')
          if [ -z "$TITLE_SLUG" ]; then
            TITLE_SLUG="post-${TOPIC_INDEX}"
          fi
          # Truncate title slug to 50 chars to keep URLs short
          TITLE_SLUG="${TITLE_SLUG:0:50}"
          TITLE_SLUG="${TITLE_SLUG%-}" # remove trailing hyphen if truncated
          SLUG="${TODAY}-${TITLE_SLUG}"
          FILE_PATH="content/blog/${SLUG}.md"

          # Force correct date in frontmatter in case AI generated a wrong one
          POST_CONTENT=$(echo "$POST_CONTENT" | sed "s/^date: .*/date: \"$TODAY\"/m")

          # Inject the image field into the frontmatter (before the closing ---)
          MODIFIED_CONTENT=$(echo "$POST_CONTENT" | awk -v img="$IMAGE_URL" '
            BEGIN { count=0 }
            /^---$/ { count++ }
            count==2 && /^---$/ { print "image: \"" img "\"" }
            { print }
          ')

          echo "$MODIFIED_CONTENT" > "$FILE_PATH"
          echo "Post written to $FILE_PATH"
          head -10 "$FILE_PATH"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/blog/
          git diff --staged --quiet || git commit -m "chore: add weekly blog post for $(date +%Y-%m-%d)"
          git push

      - name: Trigger Vercel deploy
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          curl -X POST "$VERCEL_DEPLOY_HOOK"

name: Weekly Blog Post

on:
  # Triggered by EasyCron on Tuesday at 8am UTC
  # Do not add a schedule here — EasyCron is the only trigger
  # workflow_dispatch is required for manual test runs
  workflow_dispatch:
    inputs:
      force:
        description: 'Skip the Tuesday day check (for testing)'
        required: false
        default: 'false'

jobs:
  generate-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Generate blog post with AI
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: |
          TODAY=$(date +%Y-%m-%d)
          export TODAY

          # Only post on Tuesdays (2) — protects against backup cron running on other days
          DAY_OF_WEEK=$(date +%u)
          if [ "$DAY_OF_WEEK" != "2" ] && [ "${{ github.event.inputs.force }}" != "true" ]; then
            echo "Today is not Tuesday (day $DAY_OF_WEEK) — skipping post."
            exit 0
          fi

          # Fetch recent news headlines for optional context
          NEWS_HEADLINES=$(curl -s --max-time 10 \
            "https://news.google.com/rss/search?q=powerpoint+presentations+workplace+design&hl=en-GB&gl=GB&ceid=GB:en" \
            | grep -oP '(?<=<title>)[^<]+' \
            | sed '1d' | head -5 \
            | tr '\n' '|' | sed 's/|$//' | sed 's/|/ | /g') || NEWS_HEADLINES=""
          export NEWS_HEADLINES
          echo "News context: $NEWS_HEADLINES"

          # Generate post using the editorial brief script
          POST_JSON=$(python3 scripts/generate-post.py)
          STATUS=$(echo "$POST_JSON" | jq -r '.status')

          if [ "$STATUS" = "HOLD" ]; then
            echo "Post generation returned HOLD — skipping this run."
            echo "$POST_JSON" | jq -r '.reason'
            exit 0
          fi

          TITLE=$(echo "$POST_JSON" | jq -r '.title')
          DESCRIPTION=$(echo "$POST_JSON" | jq -r '.description')
          BODY=$(echo "$POST_JSON" | jq -r '.body')
          TAGS_JSON=$(echo "$POST_JSON" | jq -c '.tags')

          echo "Title: $TITLE"

          # Derive slug from title
          TITLE_SLUG=$(echo "$TITLE" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/-\+/-/g' | sed 's/^-//;s/-$//')
          TITLE_SLUG="${TITLE_SLUG:0:50}"
          TITLE_SLUG="${TITLE_SLUG%-}"
          SLUG="${TODAY}-${TITLE_SLUG}"
          FILE_PATH="content/blog/${SLUG}.md"

          # Search Unsplash for an image matching the post title
          FALLBACK_IMAGE="https://images.unsplash.com/photo-1454165804606-c3d57bc86b40?w=1200&auto=format&q=80"
          SEARCH_QUERY=$(jq -rn --arg t "$TITLE" '$t | @uri')
          UNSPLASH_RESPONSE=$(curl -s --max-time 10 \
            "https://api.unsplash.com/search/photos?query=${SEARCH_QUERY}&per_page=5&orientation=landscape&content_filter=high" \
            -H "Authorization: Client-ID $UNSPLASH_ACCESS_KEY")
          IMAGE_URL=$(echo "$UNSPLASH_RESPONSE" | jq -r '.results[0].urls.regular // empty')
          if [ -z "$IMAGE_URL" ]; then
            IMAGE_URL="$FALLBACK_IMAGE"
            echo "Unsplash search failed — using fallback image"
          else
            IMAGE_URL="${IMAGE_URL%%\?*}?w=1200&auto=format&q=80"
            echo "Unsplash image: $IMAGE_URL"
          fi

          # Write the markdown file (using Python to avoid YAML/heredoc conflicts)
          export TITLE DESCRIPTION TODAY TAGS_JSON IMAGE_URL BODY FILE_PATH
          python3 scripts/write-post.py
          head -10 "$FILE_PATH"

          echo "BLOG_FILE_PATH=$FILE_PATH" >> $GITHUB_ENV
          echo "BLOG_TITLE=$TITLE" >> $GITHUB_ENV
          echo "BLOG_SLUG=$SLUG" >> $GITHUB_ENV
          echo "BLOG_IMAGE_URL=$IMAGE_URL" >> $GITHUB_ENV

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/blog/
          git diff --staged --quiet || git commit -m "chore: add weekly blog post for $(date +%Y-%m-%d) [editorial-brief]"
          git push

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx vercel --prod --yes --token=$VERCEL_TOKEN --scope=starboy-96s-projects

      - name: Send newsletter via Resend
        if: env.BLOG_FILE_PATH != ''
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          UNSUBSCRIBE_SECRET: ${{ secrets.UNSUBSCRIBE_SECRET }}
        run: |
          # Install pandoc
          sudo apt-get install -y pandoc -q

          # Strip frontmatter, convert markdown to HTML
          BODY=$(awk '/^---$/{if(++n==2){found=1;next}} found' "$BLOG_FILE_PATH")
          HTML_BODY=$(echo "$BODY" | pandoc -f markdown -t html)

          BLOG_URL="https://tlbr.io/blog/$BLOG_SLUG"

          # Build image block if we have an image
          if [ -n "$BLOG_IMAGE_URL" ]; then
            IMAGE_BLOCK='<tr><td style="padding:0;"><img src="'"$BLOG_IMAGE_URL"'" width="600" alt="" style="display:block;width:100%;max-width:600px;height:240px;object-fit:cover;" /></td></tr>'
          else
            IMAGE_BLOCK=""
          fi

          # Export vars so the Python script can read them via os.environ
          export IMAGE_BLOCK HTML_BODY BLOG_URL

          # Build base email from template file — substitute shared values with python
          EMAIL_HTML_BASE=$(python3 scripts/build-email.py)

          # Fetch all subscribers from Supabase
          SUBSCRIBERS=$(curl -s \
            "${SUPABASE_URL}/rest/v1/newsletter_subscribers?select=email" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY")

          echo "Subscribers: $SUBSCRIBERS"
          EMAILS=$(echo "$SUBSCRIBERS" | jq -r '.[].email')

          if [ -z "$EMAILS" ]; then
            echo "No subscribers found — skipping send."
            exit 0
          fi

          # Send to each subscriber with a personalised unsubscribe link
          SUCCESS=0
          FAIL=0
          while IFS= read -r EMAIL; do
            TOKEN=$(printf '%s' "$EMAIL" | openssl dgst -sha256 -hmac "$UNSUBSCRIBE_SECRET" | awk '{print $NF}')
            ENCODED_EMAIL=$(jq -rn --arg e "$EMAIL" '$e | @uri')
            UNSUB_URL="https://tlbr.io/api/unsubscribe?email=${ENCODED_EMAIL}&token=${TOKEN}"
            EMAIL_HTML=$(echo "$EMAIL_HTML_BASE" | sed "s|{{UNSUB_URL}}|$UNSUB_URL|")

            RESPONSE=$(curl -s -X POST "https://api.resend.com/emails" \
              -H "Authorization: Bearer $RESEND_API_KEY" \
              -H "Content-Type: application/json" \
              -d "$(jq -n \
                --arg to "$EMAIL" \
                --arg subject "$BLOG_TITLE" \
                --arg html "$EMAIL_HTML" \
                '{from:"tlbr.io <hello@newsletter.tlbr.io>",to:[$to],subject:$subject,html:$html}'
              )")
            ID=$(echo "$RESPONSE" | jq -r '.id // empty')
            if [ -n "$ID" ]; then
              SUCCESS=$((SUCCESS + 1))
            else
              FAIL=$((FAIL + 1))
              echo "Failed for $EMAIL: $RESPONSE"
            fi
          done <<< "$EMAILS"

          echo "Newsletter sent: $SUCCESS success, $FAIL failed"


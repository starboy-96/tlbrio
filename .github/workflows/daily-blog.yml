name: Weekly Blog Post

on:
  schedule:
    # Runs every Tuesday and Thursday at 8:00am UTC
    - cron: "0 8 * * 2,4"
  # Allow manual trigger from the GitHub Actions tab
  workflow_dispatch:

jobs:
  generate-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Generate blog post with AI
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          TODAY=$(date +%Y-%m-%d)

          # Topics to rotate through so posts stay varied
          TOPICS=(
            "Why brand consistency in presentations directly impacts client trust and how to enforce it without a design team"
            "The hidden cost of off-brand slides: how much time your team wastes fixing formatting"
            "How to build a PowerPoint template that non-designers can't break"
            "5 alignment mistakes everyone makes in PowerPoint and how to fix them in one click"
            "Why your sales deck is losing deals before you even speak"
            "How to maintain brand standards across a team of 100+ people in PowerPoint"
            "The case for a bespoke PowerPoint toolbar: why generic tools fall short for enterprise teams"
            "How to make PowerPoint work harder for your marketing team"
            "Slide design for finance teams: clarity, consistency, and credibility"
            "Why HR decks are always off-brand and what to do about it"
            "The difference between a good slide and a great one: it's not creativity, it's consistency"
            "How law firms and professional services can elevate their pitch decks"
            "From chaos to consistency: standardising presentations across a large organisation"
            "Why your design team is spending too much time fixing other people's slides"
            "What makes a PowerPoint add-in actually worth deploying company-wide"
          )

          # Pick a topic based on the week of the year so it cycles predictably
          WEEK_OF_YEAR=$(date +%V)
          TOPIC_INDEX=$(( ($WEEK_OF_YEAR - 1) % ${#TOPICS[@]} ))
          TOPIC="${TOPICS[$TOPIC_INDEX]}"

          # Curated Unsplash images — one per topic (business/presentation themed)
          IMAGES=(
            "https://images.unsplash.com/photo-1560472354-b33ff0c44a43?w=1200&auto=format&q=80"
            "https://images.unsplash.com/photo-1553484771-047a44eee27b?w=1200&auto=format&q=80"
            "https://images.unsplash.com/photo-1542744173-8e7e53415bb0?w=1200&auto=format&q=80"
            "https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=1200&auto=format&q=80"
            "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=1200&auto=format&q=80"
            "https://images.unsplash.com/photo-1522071820081-009f0129c71c?w=1200&auto=format&q=80"
            "https://images.unsplash.com/photo-1551288049-bebda4e38f71?w=1200&auto=format&q=80"
            "https://images.unsplash.com/photo-1460925895917-afdab827c52f?w=1200&auto=format&q=80"
            "https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=1200&auto=format&q=80"
            "https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?w=1200&auto=format&q=80"
            "https://images.unsplash.com/photo-1600880292203-757bb62b4baf?w=1200&auto=format&q=80"
            "https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?w=1200&auto=format&q=80"
            "https://images.unsplash.com/photo-1561070791-2526d30994b5?w=1200&auto=format&q=80"
            "https://images.unsplash.com/photo-1497366216548-37526070297c?w=1200&auto=format&q=80"
            "https://images.unsplash.com/photo-1516321497487-e288fb19713f?w=1200&auto=format&q=80"
          )
          # Use day-of-year so every post gets a different image
          DAY_OF_YEAR=$(date +%j)
          IMAGE_INDEX=$(( (10#$DAY_OF_YEAR - 1) % ${#IMAGES[@]} ))
          IMAGE_URL="${IMAGES[$IMAGE_INDEX]}"

          echo "Generating post on topic: $TOPIC"

          RESPONSE=$(curl -s "https://openrouter.ai/api/v1/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OPENROUTER_API_KEY" \
            -H "HTTP-Referer: https://tlbr.io" \
            -d "$(jq -n \
              --arg system "You are a content writer for tlbr.io — a bespoke PowerPoint add-in for enterprise teams. You write sharp, practical, opinionated blog posts about presentation design, brand consistency, and working in PowerPoint. Your tone is confident and direct, like a senior consultant who has seen every bad slide deck. No fluff. No generic advice. Write for people who work in professional services, finance, sales, marketing, and HR at companies with 100–5,000 employees. Always write in British English." \
              --arg topic "$TOPIC" \
              --arg today "$TODAY" \
              '{
                model: "meta-llama/llama-3.3-70b-instruct:free",
                temperature: 0.7,
                messages: [
                  { role: "system", content: $system },
                  { role: "user", content: ("Write a blog post on this topic: " + $topic + "\n\nReturn ONLY valid markdown starting with YAML frontmatter in this exact format (no code fences, no extra text before or after):\n\n---\ntitle: \"The title here\"\ndescription: \"A compelling one-sentence meta description that summarises the post and why it matters, between 120 and 155 characters — never shorter than 100 characters\"\ndate: \"" + $today + "\"\ntags: [\"tag1\", \"tag2\", \"tag3\"]\nauthor: \"tlbr.io team\"\n---\n\nThen the blog post content in markdown. Requirements:\n- 600-900 words\n- Use ## for section headings\n- Use bullet points where appropriate\n- Include a practical takeaway or clear conclusion\n- Do not mention competitors by name\n- Do not use the phrase \"in conclusion\"\n- Do not use em dashes") }
                ]
              }' \
            )"
          )

          # Extract the content from the API response
          POST_CONTENT=$(echo "$RESPONSE" | jq -r '.choices[0].message.content')

          if [ -z "$POST_CONTENT" ] || [ "$POST_CONTENT" = "null" ]; then
            echo "Error: No content returned from OpenAI"
            echo "Response: $RESPONSE"
            exit 1
          fi

          # Derive a clean slug from the generated title, always prefixed with date for uniqueness
          TITLE=$(echo "$POST_CONTENT" | grep -m1 '^title:' | sed 's/^title: *//' | tr -d '"' | tr -d "'")
          TITLE_SLUG=$(echo "$TITLE" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/-\+/-/g' | sed 's/^-//;s/-$//')
          if [ -z "$TITLE_SLUG" ]; then
            TITLE_SLUG="post-${TOPIC_INDEX}"
          fi
          SLUG="${TODAY}-${TITLE_SLUG}"
          FILE_PATH="content/blog/${SLUG}.md"

          # Inject the image field into the frontmatter (before the closing ---)
          MODIFIED_CONTENT=$(echo "$POST_CONTENT" | awk -v img="$IMAGE_URL" '
            BEGIN { count=0 }
            /^---$/ { count++ }
            count==2 && /^---$/ { print "image: \"" img "\"" }
            { print }
          ')

          echo "$MODIFIED_CONTENT" > "$FILE_PATH"
          echo "Post written to $FILE_PATH"
          head -10 "$FILE_PATH"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/blog/
          git diff --staged --quiet || git commit -m "chore: add weekly blog post for $(date +%Y-%m-%d)"
          git push
